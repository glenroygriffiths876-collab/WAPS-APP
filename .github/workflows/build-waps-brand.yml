name: Build official WAPS brand assets
on:
  push:
    paths:
      - 'assets/brand/waps-official-source.png'
permissions:
  contents: write
jobs:
  build-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: pip install pillow numpy
      - name: Generate official brand assets
        run: python scripts/generate_waps_brand.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          required=[16,32,48,72,96,128,144,152,180,192,384,512]
          for n in required:
              p=Path(f'icon-{n}.png')
              assert p.exists(), p
              assert Image.open(p).size==(n,n), (p,Image.open(p).size)
          for n in (192,512):
              p=Path(f'maskable-{n}.png')
              assert p.exists() and Image.open(p).size==(n,n)
          assert Image.open('apple-touch-icon.png').size==(180,180)
          assert Path('assets/brand/waps-full.png').exists()
          assert Path('assets/brand/waps-mark.png').exists()
          assert Path('assets/brand/icon-qa-board.jpg').exists()
          print('Brand QA passed')
          PY
          git config user.name "WAPS Brand Builder"
          git config user.email "actions@github.com"
          git add icon-*.png maskable-*.png apple-touch-icon.png icon.svg icon-master.svg maskable-master.svg assets/brand/waps-full.png assets/brand/waps-mark.png assets/brand/icon-master.png assets/brand/maskable-master.png assets/brand/icon-qa-board.jpg
          if git diff --cached --quiet; then
            echo "No generated brand changes"
          else
            git commit -m "Generate official WAPS brand and icon set"
            git push
          fi
