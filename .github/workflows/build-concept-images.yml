name: Build WAPS individual concept images
on:
  push:
    branches: [main]
    paths:
      - 'assets/concepts/waps-concepts-sprite-v2.webp'
      - 'tools/split_concept_sprite.py'
      - '.github/workflows/build-concept-images.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/split_concept_sprite.py
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/concepts/individual
          if git diff --cached --quiet; then
            echo "No generated-image changes."
          else
            git commit -m "Generate sharp individual WAPS concept images"
            git push
          fi
