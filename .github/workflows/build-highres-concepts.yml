name: Build WAPS high-resolution teaching images
on:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_highres_concepts.py'
      - '.github/workflows/build-highres-concepts.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync to latest main before generation
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow requests "rembg[cpu]"
      - run: python tools/fetch_highres_concepts.py
      - name: Commit high-resolution teaching assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/concepts/highres
          if git diff --cached --quiet; then
            echo "No high-resolution image changes."
          else
            git commit -m "Add high-resolution isolated WAPS teaching images"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
