name: Build official WAPS brand assets
on:
  push:
    paths:
      - 'assets/brand/waps-mark.svg'
      - 'assets/brand/waps-full.svg'
      - 'assets/brand/waps-icon.svg'
      - 'assets/brand/waps-maskable.svg'
permissions:
  contents: write
jobs:
  build-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: pip install pillow cairosvg
      - name: Generate official WAPS icons
        run: python scripts/generate_waps_brand.py
      - name: Commit generated icon set
        run: |
          git config user.name "WAPS Brand Builder"
          git config user.email "actions@github.com"
          git add icon-*.png maskable-*.png apple-touch-icon.png icon.svg icon-master.svg maskable-master.svg assets/brand/icon-qa-board.jpg
          if git diff --cached --quiet; then
            echo "No generated brand changes"
          else
            git commit -m "Generate official WAPS icon set"
            git push
          fi
