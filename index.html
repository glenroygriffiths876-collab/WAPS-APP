<!doctype html><html lang="en-JM"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B6B62"><meta name="description" content="WAPS Communication — free, private, caregiver-guided communication support."><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./app.css"><link rel="icon" href="./icon.svg"><title>WAPS Communication</title></head><body>
<a class="skip" href="#main">Skip to content</a><div id="offlineBanner" class="offline hidden">You’re offline — core WAPS tools still work.</div>
<header class="topbar waps-header">
  <button class="brand waps-wordmark" data-route="home" aria-label="WAPS Communication home"><span class="waps-letters" aria-hidden="true"><i>W</i><i>A</i><i>P</i><i>S</i><em>♥</em></span><span class="wordmark-sub">Communication</span></button>
  <nav class="desktopnav" aria-label="Primary navigation">
    <button data-route="home"><span class="navico homeico">◆</span><b>Home</b></button>
    <button data-route="talk"><span class="navico talkico">•••</span><b>Talk</b></button>
    <button data-route="practice"><span class="navico practiceico">★</span><b>Practice</b></button>
    <button data-route="coach"><span class="navico coachico">●●</span><b>Coach</b></button>
    <button data-route="progress"><span class="navico progressico">▥</span><b>Progress</b></button>
    <button data-route="more"><span class="navico moreico">▦</span><b>More</b></button>
  </nav>
  <div class="header-actions"><button id="childSwitcher" class="child-chip">Set up child</button><button class="header-circle" data-action="settings" aria-label="Settings">⚙</button><button class="header-circle" data-action="speakPage" aria-label="Read page aloud">🔊</button></div>
</header>
<main id="main" tabindex="-1"></main>
<nav class="bottomnav" aria-label="Primary navigation"><button data-route="home"><span>⌂</span>Home</button><button data-route="talk"><span>◉</span>Talk</button><button data-route="practice"><span>◇</span>Practise</button><button data-route="coach"><span>◎</span>Coach</button><button data-route="progress"><span>↗</span>Progress</button><button data-route="more"><span>•••</span>More</button></nav>
<dialog id="modal"><div id="modalBody"></div><form method="dialog" class="dialog-close"><button class="btn ghost">Close</button></form></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script></body></html>
