name: Materialize WAPS v49 font and music assets
on:
  push:
    branches: [main]
    paths:
      - 'assets/fonts/Fredoka-Variable.ttf'
      - '.github/workflows/materialize-v49-assets.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Fredoka WOFF2
        run: |
          python -m pip install --quiet "fonttools[woff]"
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path
          src=Path('assets/fonts/Fredoka-Variable.ttf')
          out=Path('assets/fonts/fredoka-variable.woff2')
          font=TTFont(src)
          font.flavor='woff2'
          font.save(out)
          print(out, out.stat().st_size)
          PY
      - name: Install audio encoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate original WAPS Gentle Steps music
        run: |
          mkdir -p assets/audio
          python - <<'PY'
          import math, wave, struct
          from pathlib import Path
          sr=44100
          bpm=72
          beat=60/bpm
          bars=8
          dur=bars*4*beat
          n=int(sr*dur)
          # Warm, predictable I-V-vi-IV loop in C major, with soft arpeggio.
          chords=[
            (130.81,164.81,196.00), # C3 E3 G3
            (98.00,123.47,146.83),  # G2 B2 D3
            (110.00,130.81,164.81), # A2 C3 E3
            (87.31,110.00,130.81),  # F2 A2 C3
          ]
          melody=[261.63,329.63,392.00,329.63,293.66,392.00,493.88,392.00,
                  261.63,329.63,440.00,329.63,261.63,349.23,440.00,349.23]
          def env(t,attack=.18,release=.5,length=beat):
              if t<0 or t>length:return 0.0
              a=min(1.0,t/attack)
              r=min(1.0,(length-t)/release)
              return max(0.0,min(a,r))**1.7
          frames=[]
          fade=1.2
          for i in range(n):
              t=i/sr
              bar=int(t/(4*beat))
              chord=chords[bar%4]
              local=t%(4*beat)
              # wide slow pad
              s=0.0
              for j,f in enumerate(chord):
                  trem=0.94+0.06*math.sin(2*math.pi*(0.05+j*0.012)*t)
                  s += 0.055*trem*math.sin(2*math.pi*f*t + j*.9)
                  s += 0.018*trem*math.sin(2*math.pi*(f*2)*t + j*.4)
              # gentle one-note-per-beat bell/mallet line
              step=int(t/beat)
              mt=t%beat
              mf=melody[step%len(melody)]
              e=env(mt,.08,.6,beat*.92)
              bell=(math.sin(2*math.pi*mf*t)+.35*math.sin(2*math.pi*mf*2*t)+.12*math.sin(2*math.pi*mf*3*t))
              s += 0.075*e*bell
              # soft sub pulse, no percussion
              pulse=(1-math.cos(2*math.pi*(local/(4*beat))))*.5
              s += 0.018*pulse*math.sin(2*math.pi*(chord[0]/2)*t)
              # seam fade for clean loop
              seam=min(1.0,t/fade,(dur-t)/fade)
              s*=seam
              # soft saturation
              s=math.tanh(s*1.25)*0.72
              frames.append(struct.pack('<h',int(max(-1,min(1,s))*32767)))
          p=Path('/tmp/waps-gentle-steps.wav')
          with wave.open(str(p),'wb') as w:
              w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr);w.writeframes(b''.join(frames))
          print('wav',p.stat().st_size,'duration',dur)
          PY
          ffmpeg -y -loglevel error -i /tmp/waps-gentle-steps.wav -codec:a libmp3lame -b:a 72k -ar 44100 -ac 1 assets/audio/waps-gentle-steps.mp3
          ls -lh assets/audio/waps-gentle-steps.mp3
      - name: Write asset provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          meta={
            "track_id":"waps-gentle-steps",
            "title":"Gentle Steps",
            "type":"original instrumental background music",
            "source":"Original WAPS-generated audio asset",
            "creator":"WAPS Communication",
            "rights_status":"Original application asset; no third-party recording bundled",
            "created":"2026-09-30",
            "file":"./assets/audio/waps-gentle-steps.mp3",
            "character":"slow warm pad and soft bell-like melody; no vocals; no percussion; no therapeutic claim",
            "default":"off",
            "default_volume":0.24,
            "speech_ducking":True,
            "loop":True,
            "notes":"Generated specifically for WAPS v49. Optional background music only."
          }
          Path('assets/audio/manifest.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/fredoka-variable.woff2 assets/audio/waps-gentle-steps.mp3 assets/audio/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Materialize WAPS v49 font and Gentle Steps music"
          git push origin HEAD:main
