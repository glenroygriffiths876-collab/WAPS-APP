name: WAPS production quality gate
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'data.js'
      - 'storage.js'
      - 'trace.js'
      - 'trace-words.js'
      - 'trace-data.js'
      - 'concept-learning.js'
      - 'math-learning.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'smoke.py'
      - 'ceiling_test.mjs'
      - '.github/workflows/quality-gate.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check trace.js
          node --check trace-words.js
          node --check trace-data.js
          node --check concept-learning.js
          node --check math-learning.js
      - name: Structural smoke gate
        run: python3 smoke.py
      - name: Product ceiling gate
        run: node ceiling_test.mjs
      - name: High-resolution asset technical QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, struct
          m=Path('assets/concepts/highres/manifest.json')
          if not m.exists():
              raise SystemExit('missing high-resolution manifest')
          data=json.loads(m.read_text())
          for concept in data:
              p=Path('assets/concepts/highres')/(concept+'.webp')
              if not p.exists():
                  raise SystemExit(f'missing high-resolution asset: {concept}')
              if p.stat().st_size < 4000:
                  raise SystemExit(f'high-resolution asset suspiciously small: {concept} {p.stat().st_size}')
              b=p.read_bytes()[:30]
              if b[:4]!=b'RIFF' or b[8:12]!=b'WEBP':
                  raise SystemExit(f'not WebP: {concept}')
          print('High-resolution technical QA PASS:',len(data),'assets')
          PY
